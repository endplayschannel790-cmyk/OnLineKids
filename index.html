<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f8cff">
<meta name="description" content="OnLine Kids - a simpler, safer social app for young children.">
<link rel="manifest" href="./manifest.json">
<title>OnLine Kids</title>

<style>
:root{
  --bg:#eef6ff;
  --panel:#fff;
  --ink:#17223b;
  --muted:#63708b;
  --blue:#4f8cff;
  --purple:#8d62ff;
  --line:#dce7f7;
  --danger:#e95b70;
  --good:#25a56a
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(160deg,#eaf4ff,#f7f0ff);
  color:var(--ink);
  font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}

button,input{font:inherit}

button{
  border:0;
  border-radius:14px;
  padding:11px 15px;
  background:linear-gradient(110deg,var(--blue),var(--purple));
  color:#fff;
  font-weight:750;
  cursor:pointer
}

button.secondary{
  background:#edf3ff;
  color:#29416f;
  border:1px solid var(--line)
}

button.danger{
  background:#ffe8ed;
  color:#9d3044;
  border:1px solid #ffd0d8
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#ffffffee;
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:13px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.brand{
  font-size:25px;
  font-weight:950;
  background:linear-gradient(90deg,#3f86ff,#965cff);
  color:transparent;
  background-clip:text;
  -webkit-background-clip:text
}

.wrap{
  max-width:1050px;
  margin:auto;
  padding:18px
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 10px 30px #4f8cff14
}

h1,h2,h3{margin:0 0 10px}

.muted{color:var(--muted)}

.small{
  font-size:12px;
  color:var(--muted)
}

input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fbfdff;
  color:var(--ink);
  outline:none
}

input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #4f8cff18
}

.field{margin:11px 0}

.row{
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap
}

.row>*{min-width:0}

.hidden{display:none!important}

.notice{
  padding:13px;
  border-radius:14px;
  background:#eef5ff;
  border:1px solid #d7e7ff;
  margin:10px 0
}

.warning{
  background:#fff6df;
  border-color:#ffe2a1
}

.success{
  background:#eafaf2;
  border-color:#bfead2
}

.error{
  background:#fff0f3;
  border-color:#ffcbd4
}

nav{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:10px 0 15px
}

nav button{
  white-space:nowrap;
  background:#fff;
  color:#53617e;
  border:1px solid var(--line)
}

nav button.active{
  background:linear-gradient(110deg,#4f8cff,#8d62ff);
  color:#fff;
  border-color:transparent
}

.grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 290px;
  gap:15px
}

.side{
  position:sticky;
  top:78px;
  height:max-content
}

.profile{
  display:flex;
  gap:12px;
  align-items:center
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#4f8cff,#a46bff);
  color:#fff;
  font-size:20px;
  font-weight:900;
  flex:none
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px
}

.stat{
  background:#f4f7ff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  text-align:center
}

.stat b{
  font-size:20px;
  display:block
}

.command-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px
}

.command{
  padding:14px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fbfdff
}

.command h3{font-size:15px}

.lock{
  font-size:42px;
  text-align:center
}

.center{text-align:center}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#edf3ff;
  color:#53617e;
  font-size:12px
}

@media(max-width:800px){
  .grid{grid-template-columns:1fr}
  .side{position:static}
  .command-grid{grid-template-columns:1fr}
}

@media(max-width:500px){
  .stat
